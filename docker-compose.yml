services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: news_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"   # REST API + Web UI
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC API
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:z
      - ./data/qdrant_snapshots:/qdrant/snapshots:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'